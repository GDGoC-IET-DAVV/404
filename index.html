<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>404 | SYSTEM FAILURE</title>
    <link rel="icon" type="image/png" href="newlogo.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@700&family=Bebas+Neue&family=Permanent+Marker&family=Share+Tech+Mono&family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        /* --- 1. GLOBAL & LAYERS --- */
        :root {
            --base-color: #000000;
            --stranger-red: #e71d23;
        }

        body {
            background-color: var(--base-color);
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            overflow-y: auto;
            text-align: center;
            position: relative;
            user-select: none;
            -webkit-user-select: none;
            cursor: default; 
            transition: box-shadow 0.2s;
            perspective: 1000px;
            background-attachment: fixed;
        }

        /* --- BACKGROUND VIDEOS --- */
        #bg-video, #meme-video {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover;
        }
        
        #bg-video { z-index: -2; opacity: 0; transition: opacity 4s ease-in-out; }
        .started #bg-video { opacity: 0.5; }

        /* Meme video hidden by default */
        #meme-video { z-index: 5000; display: none; }

        /* Dust Particles */
        #dust-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none;
        }

        /* --- 2. INTRO OVERLAY --- */
        #intro-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000; z-index: 9999;
            display: flex; justify-content: center; align-items: center; flex-direction: column;
            cursor: pointer; transition: opacity 1s ease-out; 
        }

        .netflix-text {
            font-family: 'Bebas Neue', sans-serif; font-size: 4rem; color: #e50914; 
            letter-spacing: 2px; opacity: 0; transition: opacity 1s;
            text-shadow: 0 0 20px rgba(229, 9, 20, 0.5); pointer-events: none;
        }

        /* Crack Visuals */
        .crack-container { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
        .crack-path {
            fill: none; stroke: #070707; stroke-width: 0; stroke-linecap: round; stroke-linejoin: round;
            opacity: 0; stroke-dasharray: 400; stroke-dashoffset: 400;
            filter: drop-shadow(0 0 1px #000) drop-shadow(0 0 2px #000);
            transition: stroke-width 0.35s ease-out, stroke-dashoffset 0.9s ease-out, opacity 0.4s ease-out;
        }
        .upside-down-mode .crack-path {
            stroke: #ff0000;
            filter: drop-shadow(0 0 3px #000) drop-shadow(0 0 8px #ff0000) drop-shadow(0 0 18px rgba(255, 0, 0, 1));
            animation: pulse-veins 0.6s infinite alternate;
        }
        @keyframes pulse-veins { from { stroke-opacity: 0.9; } to { stroke-opacity: 0.5; } }
        .shake { animation: shake 0.3s cubic-bezier(.36,.07,.19,.97) both; }
        .shake-hard { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 2px, 0); } 20%, 80% { transform: translate3d(4px, -2px, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 4px, 0); } 40%, 60% { transform: translate3d(6px, -4px, 0); }
        }

        /* --- 3. MAIN CONTENT --- */
        #main-content {
            transition: opacity 1s;
            width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center;
        }

        #bg-logo {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(1.5);
            width: 600px; height: 400px; z-index: 1; pointer-events: none;
            display: flex; justify-content: space-between; align-items: center; padding: 0 50px;
        }
        .bracket { position: relative; width: 200px; height: 200px; display: flex; align-items: center; opacity: 0; }
        .started .bracket-left { animation: slowReveal 5s ease-out forwards; }
        .started .bracket-right { animation: slowReveal 5s ease-out 4s forwards; }
        @keyframes slowReveal { 0% { opacity: 0; filter: blur(10px); } 100% { opacity: 1; filter: blur(0px); } }
        .pill { position: absolute; width: 260px; height: 100px; background-color: var(--base-color); border-radius: 999px; transition: transform 1s, opacity 1s; }
        .bracket-left .top, .bracket-right .bottom { border: 1px solid rgba(255, 0, 0, 0.6); box-shadow: 0 0 8px rgba(255, 0, 0, 0.4); z-index: 1; }
        .bracket-left .bottom, .bracket-right .top { border: 1.5px solid rgba(255, 50, 50, 0.9); box-shadow: 0 0 5px red, 0 0 30px rgba(255,0,0,0.6), inset 0 0 10px rgba(100,0,0,0.5); z-index: 10; }
        .bracket-left { justify-content: flex-start; } .bracket-left .pill { transform-origin: 50px 50%; left: 0; } .bracket-left .top { transform: rotate(-40deg); } .bracket-left .bottom { transform: rotate(40deg); }
        .bracket-right { justify-content: flex-end; } .bracket-right .pill { transform-origin: calc(100% - 50px) 50%; right: 0; } .bracket-right .top { transform: rotate(40deg); } .bracket-right .bottom { transform: rotate(-40deg); }

        .text-container { z-index: 2; opacity: 0; display: flex; flex-direction: column; align-items: center; width: 90%; transition: transform 0.8s ease-in, opacity 0.5s; }
        .started .text-container { animation: fadeInText 3s ease-out 8s forwards; }
        h1 { margin: 0; padding-bottom: 20px; font-family: 'Libre Baskerville', serif; font-weight: 700; font-size: 3.5rem; text-transform: uppercase; letter-spacing: -2px; color: #000; -webkit-text-stroke: 2px var(--stranger-red); text-shadow: 0 0 15px rgba(231, 29, 35, 0.5); line-height: 1.1; }
        h1::before { content: ''; display: block; width: 100%; height: 2px; background: var(--stranger-red); box-shadow: 0 0 10px var(--stranger-red); margin-bottom: 10px; transform: scaleX(0); }
        .started h1::before { animation: expandBar 2s ease-out 9s forwards; }
        @keyframes expandBar { to { transform: scaleX(1); } }
        p { font-family: 'Courier New', Courier, monospace; font-size: 1.2rem; margin: 10px 0 0 0; text-shadow: 0 0 5px rgba(255, 0, 0, 0.5); letter-spacing: 2px; color: #ddd; }
        .dot { animation: blink 1.4s infinite both; margin-left: 2px; } .dot:nth-child(1) { animation-delay: 0s; } .dot:nth-child(2) { animation-delay: 0.2s; } .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink { 0% { opacity: 0.2; } 20% { opacity: 1; text-shadow: 0 0 5px red; } 100% { opacity: 0.2; } }
        
        #countdown { margin-top: 30px; font-family: 'Courier New', Courier, monospace; font-size: 1.5rem; letter-spacing: 3px; color: #fff; text-shadow: 0 0 15px red; border-top: 1px solid rgba(255,0,0,0.3); border-bottom: 1px solid rgba(255,0,0,0.3); padding: 10px 20px; background: rgba(20,0,0,0.5); transition: transform 0.8s ease-out; }
        @keyframes fadeInText { to { opacity: 1; } }

        /* --- BUTTON (Fixed Position) --- */
        #runaway-btn { 
            position: fixed; top: 70%; left: 50%;
            transform: translate(-50%, -50%);
            padding: 15px 30px; 
            font-family: 'Courier New', Courier, monospace; 
            font-weight: bold; 
            font-size: 16px; 
            cursor: pointer; 
            background-color: #000; 
            color: red; 
            border: 2px solid red; 
            z-index: 100; 
            box-shadow: 0 0 15px red; 
            opacity: 0; 
            text-transform: uppercase; 
            white-space: nowrap;
            -webkit-tap-highlight-color: transparent; 
            transition: top 0.1s ease-out, left 0.1s ease-out; 
        }
        .started #runaway-btn { animation: fadeInText 2s ease-out 10s forwards; }

        /* Quote Container */
        #quote-container {
            position: fixed; bottom: 40px; width: 90%; text-align: center; opacity: 0; z-index: 50; transition: opacity 0.3s; pointer-events: none;
        }
        #quote-text { font-family: 'Libre Baskerville', serif; font-size: 1.2rem; color: #fff; text-shadow: 0 0 8px var(--stranger-red); font-style: italic; margin: 0; }
        #quote-author { display: block; margin-top: 5px; font-family: 'Courier New', monospace; font-size: 0.9rem; color: #888; text-transform: uppercase; letter-spacing: 2px; }

        /* ========================================= */
        /* === GAME OVERLAY STYLES (THE WALL) === */
        /* ========================================= */
        #game-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2000; display: none;
            flex-direction: column; justify-content: center; align-items: center;
            background-color: #050000; 
            background-image: radial-gradient(circle, #2b0000 0%, #000000 80%);
            box-shadow: inset 0 0 100px #000;
            opacity: 0; transition: opacity 1s ease-in;
        }

        #wall-instruction {
            font-family: 'Libre Baskerville', serif; color: #ff0033; font-size: 1.5rem; 
            margin-bottom: 20px; z-index: 2001; text-shadow: 0 0 15px #ff0033; letter-spacing: 4px; text-transform: uppercase;
            animation: text-flicker-red 4s infinite;
        }
        @keyframes text-flicker-red { 0%, 100% { opacity: 1; } 50% { opacity: 0.8; } 52% { opacity: 0.4; } 54% { opacity: 0.8; } }

        #alphabet-wall {
            display: flex; flex-wrap: wrap; justify-content: center; width: 95%; max-width: 900px; gap: 15px; z-index: 1001;
        }

        .letter-container {
            display: flex; flex-direction: column; align-items: center; width: 50px; position: relative; cursor: pointer;
        }

        .wire {
            position: absolute; top: -10px; left: -25px; width: 80px; height: 2px; background: #222; transform: rotate(10deg); z-index: 0; pointer-events: none;
        }

        .bulb {
            width: 20px; height: 35px; border-radius: 50%; background: #444; margin-bottom: 2px; z-index: 1;
            box-shadow: inset -5px -5px 10px rgba(0,0,0,0.5), 0 0 2px #000; transition: all 0.1s;
        }

        .letter-char {
            font-family: 'Permanent Marker', cursive; font-size: 2.5rem; color: #dcdcdc; 
            text-shadow: 2px 2px 4px #000; opacity: 0.9;
            width: 50px; height: 50px; display: flex; justify-content: center; align-items: center; 
        }

        .bulb.glow-red { background: #ff0000; box-shadow: 0 0 20px #ff0000, inset 5px 5px 10px #fff; }
        .bulb.glow-blue { background: #00eaff; box-shadow: 0 0 20px #00eaff, inset 5px 5px 10px #fff; }
        .bulb.glow-yellow { background: #ffea00; box-shadow: 0 0 20px #ffea00, inset 5px 5px 10px #fff; }
        .bulb.glow-green { background: #33ff00; box-shadow: 0 0 20px #33ff00, inset 5px 5px 10px #fff; }

        /* ========================================= */
        /* === GRAND REVEAL STYLES (THE RIFT) === */
        /* ========================================= */
        #grand-reveal {
            position: relative;
            width: 100%; min-height: 100vh;
            z-index: 10000; /* Highest priority */
            background: radial-gradient(circle at center, #111 0%, #000 100%);
            display: none; justify-content: center; align-items: center;
            flex-direction: column;
            opacity: 0; transition: opacity 0.5s;
            padding: 72px 16px 120px;
            overflow: visible;
            background-attachment: fixed;
        }

        /* Red-core / black vignette overlay that persists while scrolling */
        #grand-reveal::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 50% 35%, rgba(255, 0, 0, 0.18) 0%, rgba(0, 0, 0, 0.9) 40%, #000 65%),
                radial-gradient(circle at 50% 65%, rgba(0, 0, 0, 0.8) 0%, #000 80%),
                linear-gradient(180deg, rgba(0,0,0,0.65), rgba(0,0,0,0.95));
            pointer-events: none;
            z-index: -1;
        }

        /* --- 1. TV OFF EFFECT --- */
        #tv-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: white; z-index: 20000; pointer-events: none;
            opacity: 0; display: none;
        }
        .tv-off-anim {
            display: block !important;
            animation: tv-off 0.5s cubic-bezier(0.23, 1, 0.32, 1) forwards;
        }
        @keyframes tv-off {
            0% { opacity: 1; transform: scale(1, 1); }
            40% { opacity: 1; transform: scale(1, 0.005); }
            100% { opacity: 1; transform: scale(0, 0); }
        }

        /* --- 2. BACK LIGHT (Small & Vignetted) --- */
        .back-light {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 4px; height: 4px;
            background: #fff; /* White core */
            box-shadow: 0 0 10px 5px rgba(200, 200, 200, 0.5); 
            z-index: -1;
            border-radius: 50%;
            opacity: 0;
            transition: all 4s ease-in-out; 
        }
        /* Vignette Overlay to enhance darkness */
        .vignette-layer {
            position: absolute; inset: 0;
            background: radial-gradient(circle, transparent 20%, #000 90%);
            z-index: 0; pointer-events: none;
        }
        
        .light-expand {
            transform: translate(-50%, -50%) scale(1.5);
            opacity: 0.8; 
        }
        .light-fill-screen {
            transform: translate(-50%, -50%) scale(300);
            background: #ff0000; /* Turns red at end */
            opacity: 0.2;
            transition: transform 3s ease-out, opacity 3s, background 1s;
        }

        /* --- 3. 3D CARD CONTAINER --- */
        .rift-container {
            position: relative;
            padding: 12px;
            display: flex; flex-direction: column; align-items: center;
            gap: 12px;
            max-width: 95%;
            text-align: center;
            z-index: 10;
            perspective: 1000px;
        }

        .reveal-layout {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            width: 100%;
            max-width: 1200px;
        }

        .reveal-flex {
            display: flex;
            flex-direction: column;
            gap: 22px;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 720px;
            margin: 0 auto;
        }

        /* Plain White Cinematic Text (Bebas Neue) */
        .reveal-title {
            font-family: 'Share Tech Mono', monospace; font-size: 2.8rem; color: #fff;
            text-shadow: none; margin: 8px 0; letter-spacing: 4px;
            text-transform: uppercase;
            opacity: 0; 
            transition: opacity 1s ease-in;
        }
        .title-show { opacity: 1; }
        .move-up { transform: translateY(-20px); transition: transform 2s ease-in-out; }

        /* --- 4. INTERACTIVE CARD & GRID --- */
        #card-wrapper {
            width: 440px;
            aspect-ratio: 2 / 3;
            height: auto;
            max-width: 95vw;
            max-height: 75vh;
            position: relative;
            transform-style: preserve-3d;
            opacity: 0; 
            margin: 12px 0 4px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0,0,0,1);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* Smooth pan/zoom */
        }
        
          #poster-img {
            position: absolute;
            inset: 0;
            width: 100%; height: 100%; 
            object-fit: contain;
            background: #000;
            border-radius: 8px;
            display: block;
        }
        
        /* CARD SCANLINES (TV LINE EFFECT) */
        #card-wrapper::before {
            content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 5; background-size: 100% 2px, 3px 100%; pointer-events: none; border-radius: 4px;
        }

        /* GRID OVERLAY (Red Lines) */
        #grid-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: grid;
            grid-template-columns: repeat(10, 1fr); /* 10x10 Grid */
            grid-template-rows: repeat(10, 1fr);
            z-index: 20;
            border: 1px solid #500;
            border-radius: 8px;
        }
        .grid-cell {
            background-color:#000; /* let poster show through */
            border: 1px solid rgba(255, 0, 0, 0.2); 
            transition: opacity 0.1s ease-out;
        }
        
        /* Peek Logic */
        .peek-reveal { opacity: 0 !important; }
        
        /* Burning Animation from Center */
        .burn {
            background-color: #ff3300;
            box-shadow: 0 0 20px #ff3300;
            border-color: #fff;
            opacity: 1;
            transition: all 0.1s;
        }
        .vanish {
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.3s;
        }

        /* Shining Edge Effect */
        #card-wrapper::after {
            content: ""; position: absolute; top: -1px; left: -1px; right: -1px; bottom: -1px;
            background: linear-gradient(45deg, #500, #f00, #500);
            z-index: -1; border-radius: 5px; opacity: 0; transition: opacity 0.3s;
        }
        #card-wrapper:hover::after { opacity: 0.8; animation: shimmer 2s infinite linear; }
        @keyframes shimmer { 0% { background-position: 0% 50%; } 100% { background-position: 100% 50%; } }

        /* --- 5. RETRO BUTTONS --- */
        .action-stack {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
            align-items: center;
        }

        .interaction-area, .share-area {
            margin-top: 0;
            display: flex; flex-direction: column; align-items: center;
            gap: 12px;
            padding: 16px 18px;
            position: relative; opacity: 0; transition: opacity 1s;
            background: radial-gradient(circle at center, rgba(255,0,0,0.12) 0%, rgba(0,0,0,0.88) 65%);
            border: 1px solid rgba(255,0,0,0.2);
            border-radius: 12px;
            box-shadow: 0 0 24px rgba(0,0,0,0.45);
            width: 100%;
            max-width: 520px;
            flex-shrink: 0;
        }
        .btn-row { display: flex; gap: 40px; }
        .btn-row:last-of-type { flex-wrap: wrap; justify-content: center; gap: 20px; }

        .retro-btn {
            background: #000; color: #fff; padding: 10px 20px;
            font-family: 'Press Start 2P', cursive; font-size: 0.9rem;
            border: 2px solid #fff; cursor: pointer;
            box-shadow: 4px 4px 0px #555;
            display: flex; align-items: center; gap: 10px;
            transition: all 0.1s;
            text-transform: uppercase;
        }
        .retro-btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0px #222; }
        .retro-btn.full { width: 100%; justify-content: center; }
        .retro-btn .icon {
            width: 18px;
            height: 18px;
            fill: currentColor;
            flex-shrink: 0;
        }
        
        .parallax-wrap {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            will-change: transform;
            transition: transform 0.25s ease-out;
        }

        .download-btn {
            margin-top: 12px;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.75rem;
            letter-spacing: 1px;
            color: #fff;
            text-decoration: none;
            padding: 12px 16px;
            border: 2px dashed rgba(255,0,0,0.6);
            border-radius: 12px;
            background: rgba(0,0,0,0.65);
            box-shadow: 0 0 12px rgba(255,0,0,0.25);
        }
        .download-btn.full { display: block; width: 100%; text-align: center; }

        .late-banner {
            display: none;
            margin: 0 auto 12px;
            padding: 12px 16px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1rem;
            letter-spacing: 2px;
            color: #ff6b6b;
            text-transform: uppercase;
            border: 1px solid rgba(255,0,0,0.4);
            background: rgba(0,0,0,0.65);
            box-shadow: 0 0 14px rgba(255,0,0,0.25);
            max-width: 640px;
        }
        
        .like-btn:hover { border-color: #0f0; color: #0f0; box-shadow: 4px 4px 0px #050; }
        .dislike-btn:hover { border-color: #f00; color: #f00; box-shadow: 4px 4px 0px #500; }
        
        .secret-message {
            margin-top: 25px; font-family: 'Courier New', monospace; font-size: 1rem;
            color: #ccc; text-transform: uppercase; letter-spacing: 2px;
            opacity: 0; transition: opacity 0.3s;
        }

        /* --- 6. AGGRESSIVE GLITCH EFFECTS --- */
        .glitch-active { animation: glitch-anim 0.15s infinite; }
        @keyframes glitch-anim {
            0% { transform: translate(0); clip-path: inset(0 0 0 0); }
            20% { transform: translate(-5px, 5px) skewX(5deg); clip-path: inset(10% 0 0 0); filter: contrast(1.5) hue-rotate(90deg); }
            40% { transform: translate(5px, -5px) skewX(-5deg); clip-path: inset(0 0 10% 0); }
            60% { transform: translate(-5px, 0); filter: invert(0.2); }
            80% { transform: translate(5px, 0); }
            100% { transform: translate(0); clip-path: inset(0 0 0 0); filter: none; }
        }

        @media only screen and (max-width: 768px) {
            #bg-logo { width: 600px; transform: translate(-50%, -50%) scale(0.55); padding: 0 50px; }
            h1 { font-size: 1.8rem; letter-spacing: 0px; }
            .reveal-title { font-size: 2.5rem; }
            #card-wrapper { width: 95vw; aspect-ratio: 2 / 3; height: auto; max-height: 75vh; }
            .reveal-flex { flex-direction: column; align-items: center; }
            .interaction-area, .share-area { width: 100%; max-width: 95vw; }
            .retro-btn { font-size: 0.7rem; padding: 10px; }
        }
    </style>
</head>
<body>
    
    <video id="bg-video" autoplay muted loop playsinline>
        <source src="mobile_bg.mp4" type="video/mp4" media="(max-width: 768px)">
        <source src="desktop_bg.mp4" type="video/mp4">
    </video>

    <video id="meme-video" controls playsinline>
        <source src="meme.mp4" type="video/mp4">
    </video>

    <!-- AUDIO FILES -->
    <audio id="theme-audio" src="Stranger_Things.mp3"></audio>
    <audio id="hammer-audio" src="hammer.mp3"></audio>
    <audio id="clock-audio" src="vecna_clock.mp3"></audio>
    <audio id="thunder-audio" src="thunder_crack.mp3"></audio>
    <audio id="buzz-audio" src="electric_buzz.mp3"></audio>

    <canvas id="dust-canvas"></canvas>

    <div id="intro-overlay">
        <div id="intro-msg" class="netflix-text">INHALE...</div>
        <svg class="crack-container" viewBox="0 0 100 100" preserveAspectRatio="none">
            <path id="crack1" class="crack-path" d="" />
            <path id="crack2" class="crack-path" d="" />
            <path id="crack3" class="crack-path" d="" />
        </svg>
    </div>

    <div id="main-content">
        <div id="bg-logo">
            <div class="bracket bracket-left">
                <div class="pill top explode-target"></div>

    <script>
        // --- 1. DUST SYSTEM ---
        const canvas = document.getElementById('dust-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];
        function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();
        class Particle {
            constructor() { this.x=Math.random()*width; this.y=Math.random()*height; this.vx=(Math.random()-0.5)*0.5; this.vy=(Math.random()-0.5)*0.5; this.size=Math.random()*2; this.alpha=Math.random()*0.5; }
            update() { this.x+=this.vx; this.y+=this.vy; if(this.x<0)this.x=width; if(this.x>width)this.x=0; if(this.y<0)this.y=height; if(this.y>height)this.y=0; }
            draw() { ctx.fillStyle=`rgba(180, 180, 180, ${this.alpha})`; ctx.beginPath(); ctx.arc(this.x,this.y,this.size,0,Math.PI*2); ctx.fill(); }
        }
        for(let i=0; i<80; i++) particles.push(new Particle());
        function animateDust() { ctx.clearRect(0,0,width,height); particles.forEach(p=>{p.update();p.draw();}); requestAnimationFrame(animateDust); }
        animateDust();

        // --- 2. CRACKS & INTRO ---
        const introOverlay = document.getElementById('intro-overlay');
        const introMsg = document.getElementById('intro-msg');
        const hammerAudio = document.getElementById('hammer-audio');
        let hitCount = 0; let canHit = false;

        function makeJitterLine(x1, y1, x2, y2, segments, roughness) {
            let pts = []; const dx = x2 - x1; const dy = y2 - y1; const len = Math.hypot(dx, dy) || 1; const nx = -dy / len; const ny = dx / len;
            pts.push({ x: x1, y: y1 });
            for (let i = 1; i < segments; i++) { const t = i / segments; let x = x1 + dx * t; let y = y1 + dy * t; const off = (Math.random() - 0.5) * roughness; x += nx * off; y += ny * off; pts.push({ x, y }); }
            pts.push({ x: x2, y: y2 });
            return "M" + pts.map(p => `${p.x.toFixed(2)} ${p.y.toFixed(2)}`).join(" L");
        }
        function generateWallCracks() {
            const p1 = document.getElementById("crack1"), p2 = document.getElementById("crack2"), p3 = document.getElementById("crack3");
            if (!p1) return;
            p1.setAttribute("d", makeJitterLine(0, 45, 100, 52, 35, 5));
            p2.setAttribute("d", makeJitterLine(65, 5, 70, 95, 30, 6) + " " + makeJitterLine(30, 60, 15, 80, 10, 4));
            p3.setAttribute("d", makeJitterLine(55, 40, 40, 20, 12, 4) + " " + makeJitterLine(80, 60, 95, 75, 10, 4));
        }
        function growCrack(pathId, widthPx) {
            const path = document.getElementById(pathId); if (!path) return;
            const length = path.getTotalLength();
            path.style.strokeDasharray = length; path.style.strokeDashoffset = length;
            path.getBoundingClientRect(); path.style.opacity = 1; path.style.strokeWidth = widthPx + "px"; path.style.strokeDashoffset = 0;
        }
        generateWallCracks();

        setTimeout(() => { introMsg.style.opacity = 1; }, 500); 
        setTimeout(() => { 
            introMsg.style.opacity = 0; 
            setTimeout(() => { introMsg.innerText = "HOLD YOUR BREATH"; introMsg.style.opacity = 1; canHit = true; }, 1000);
        }, 2500);

        function handleSmash(e) {
            if(!canHit) return;
            hitCount++;
            hammerAudio.currentTime = 0; hammerAudio.volume = Math.min(1, 0.4 + (hitCount * 0.2)); 
            introOverlay.classList.remove('shake', 'shake-hard'); void introOverlay.offsetWidth; 

            if(hitCount === 1) { introMsg.style.opacity = 0; growCrack('crack1', 0.8); hammerAudio.playbackRate = 1.0; introOverlay.classList.add('shake'); if(navigator.vibrate) navigator.vibrate(50); }
            else if(hitCount === 2) { growCrack('crack2', 0.7); hammerAudio.playbackRate = 0.9; introOverlay.classList.add('shake'); if(navigator.vibrate) navigator.vibrate(100); }
            else if(hitCount === 3) { growCrack('crack3', 0.7); introOverlay.classList.add('upside-down-mode'); introOverlay.classList.add('shake-hard'); hammerAudio.playbackRate = 0.7; if(navigator.vibrate) navigator.vibrate([100, 50, 100]); }
            else if(hitCount === 4) {
                hammerAudio.playbackRate = 1.2; if(navigator.vibrate) navigator.vibrate(500);
                introOverlay.style.opacity = 0; setTimeout(() => { introOverlay.style.display = 'none'; }, 1000);
                document.body.classList.add('started'); document.getElementById('theme-audio').play().catch(()=>{});
                armCountdown(); // start timer once the 404 page is visible
            }
            if(hitCount <= 4) hammerAudio.play().catch(e=>console.log(e));
        }
        introOverlay.addEventListener('mousedown', handleSmash);
        introOverlay.addEventListener('touchstart', (e) => { e.preventDefault(); handleSmash(); }, {passive: false});

        // --- 4. COUNTDOWN SYSTEM ---
        const REVEAL_DATE = new Date('2025-12-12T12:12:00');
        const TEST_COUNTDOWN_MS = 20000;
        const USE_TEST_COUNTDOWN = false; // live mode: counts to 12:12 PM on 12/12/2025
        const FORCE_LATE_PREVIEW = false; // set true only to preview late flow
        const isLateViewer = FORCE_LATE_PREVIEW || (!USE_TEST_COUNTDOWN && Date.now() >= REVEAL_DATE.getTime());
        let targetDate = null;
        let countdownStarted = false;
        let allowReveal = false;
        let lateMode = false;
        
        // DEBUG: Type finishNow() in console
        window.finishNow = function() { 
            countdownStarted = true;
            targetDate = new Date().getTime() + TEST_COUNTDOWN_MS; 
            updateCountdown();
        };
        console.log("%c TYPE finishNow() TO START REVEAL SEQUENCE", "color: red; font-size: 20px; font-weight: bold;");

        let revealTriggered = false;
        let clockStarted = false;
        let buzzingStarted = false;

        // INIT GRID
        function initGrid() {
            const grid = document.getElementById('grid-overlay');
            grid.innerHTML = '';
            for(let i=0; i<100; i++) { // 10x10
                const cell = document.createElement('div');
                cell.classList.add('grid-cell');
                cell.setAttribute('data-index', i);
                grid.appendChild(cell);
            }
        }
        initGrid();

        function handleLateArrival() {
            if (lateMode) return;
            lateMode = true;
            countdownStarted = true;
            allowReveal = true;
            targetDate = null;
            const lateBanner = document.getElementById('late-banner');
            if (lateBanner) lateBanner.style.display = 'block';
            document.getElementById("countdown").innerHTML = "SORRY, YOU ARE LATE FOR THE REVEAL";
            document.getElementById('sub-text').innerText = "The card has already been unveiled.";
            introOverlay.style.opacity = 0;
            introOverlay.style.display = 'none';
            document.body.classList.add('started');
            setTimeout(() => startRevealSequence(), 800);
        }

        if (isLateViewer) {
            handleLateArrival();
        }

        function armCountdown() {
            if (countdownStarted) return;
            if (isLateViewer) {
                handleLateArrival();
                return;
            }
            countdownStarted = true;
            revealTriggered = false;
            clockStarted = false;
            buzzingStarted = false;
            allowReveal = false;
            targetDate = USE_TEST_COUNTDOWN ? (new Date().getTime() + TEST_COUNTDOWN_MS) : REVEAL_DATE.getTime();
            updateCountdown();
        }

        window.addEventListener('load', () => {
            if (!countdownStarted && !isLateViewer) {
                armCountdown();
            }
        });

        function updateCountdown() {
            if (lateMode) {
                document.getElementById("countdown").innerHTML = "SORRY, YOU ARE LATE FOR THE REVEAL";
                return;
            }
            if(!targetDate) {
                document.getElementById("countdown").innerHTML = "Awaiting reveal...";
                return;
            }
            const now = new Date().getTime(); 
            const distance = targetDate - now;
            
            // --- T-12s: CLOCK STARTS ---
            if(distance < 12000 && !clockStarted && distance > 0) {
                clockStarted = true;
                const clock = document.getElementById('clock-audio');
                clock.volume = 1.0;
                clock.play().catch(e=>console.log("Audio needed"));
            }

            // --- T-5s: RANDOM BUZZING ---
            if (distance < 5000 && !buzzingStarted && distance > 0) {
                buzzingStarted = true;
                playRandomBuzz();
            }

            // --- T-0s: CHAOS & REVEAL ---
            if (distance < 0) {
                document.getElementById("countdown").innerHTML = "00:00:00:00";
                if (!revealTriggered) {
                    allowReveal = true; // countdown finished, gate open
                    startRevealSequence();
                }
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);
            document.getElementById("countdown").innerHTML = `${days}d ${hours}h ${minutes}m ${seconds}s`;
        }
        setInterval(updateCountdown, 100); updateCountdown();

        function playRandomBuzz() {
            if(revealTriggered) return;
            const buzz = document.getElementById('buzz-audio');
            if(Math.random() > 0.6) {
                buzz.volume = 1.0;
                buzz.currentTime = 0;
                buzz.play();
                setTimeout(() => buzz.pause(), 200 + Math.random()*300);
                document.body.style.filter = "invert(1)"; 
                setTimeout(() => document.body.style.filter = "none", 50);
            }
            setTimeout(playRandomBuzz, 500 + Math.random()*1000);
        }

        // --- HACKER TEXT EFFECT ---
        const finalChars = "FINALLY IT IS HERE";
        const randomChars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*";
        
        function startHackerText() {
            const header = document.getElementById('final-header');
            let iterations = 0;
            const interval = setInterval(() => {
                header.innerText = finalChars.split("").map((letter, index) => {
                    if(index < iterations) return finalChars[index];
                    return randomChars[Math.floor(Math.random() * randomChars.length)];
                }).join("");
                if(iterations >= finalChars.length) clearInterval(interval);
                iterations += 1/3; 
            }, 30);
        }

        function startRevealSequence() {
            // Prevent accidental double-click jumps: only run after countdown permits or other approved triggers.
            if (!allowReveal && countdownStarted) return;
            revealTriggered = true;
            console.log("SEQUENCE STARTED...");
            introOverlay.style.opacity = 0;
            introOverlay.style.display = 'none';
            document.body.style.overflowY = 'auto';
            window.scrollTo({ top: 0, behavior: 'smooth' });

            // 1. CHAOS (0s): Screen Shake + Glitch + Audio Cut
            document.body.classList.add('glitch-active');
            
            // TV OFF (Immediate)
            const tvOverlay = document.getElementById('tv-overlay');
            tvOverlay.classList.add('tv-off-anim');
            
            document.getElementById('theme-audio').pause();
            document.getElementById('buzz-audio').pause();
            document.getElementById('clock-audio').pause();
            
            // REMOVE BG VIDEO & HIDE CONTENT
            document.getElementById('bg-video').style.display = 'none';
            document.getElementById('main-content').style.display = 'none';
            document.getElementById('game-overlay').style.display = 'none';
            
            // Go Dark
            setTimeout(() => {
                document.body.classList.remove('glitch-active');
                document.body.style.backgroundColor = "black";
                document.body.style.transform = "none";
                document.body.style.filter = "none";
                document.getElementById('grand-reveal').style.display = 'flex';
                document.getElementById('grand-reveal').style.opacity = 1;
            }, 500);

            // 2. DOT OF LIGHT (T+2s) - Small dot with vignette
            setTimeout(() => {
                const light = document.querySelector('.back-light');
                light.style.opacity = 1;
                light.classList.add('light-expand'); 
            }, 2000);

            // 3. CARD APPEARS & THUNDER (T+4s) 
            setTimeout(() => {
                const card = document.getElementById('card-wrapper');
                card.style.opacity = 1; // It's black grid initially
                
                // Play Thunder immediately upon arrival
                const thunder = document.getElementById('thunder-audio');
                thunder.volume = 1.0;
                thunder.play();
            }, 4000);

            // 4. ZOOM PAN PEEK SEQUENCE (T+6s to T+12s)
            
            // Pan 1: Top Left
            setTimeout(() => {
                doZoomPan('top left', [0,1,10,11]);
            }, 6000);

            // Pan 2: Top Right (Glitch Transition)
            setTimeout(() => {
                triggerGlitchTransition();
                doZoomPan('top right', [8,9,18,19]);
            }, 9000);

            // Pan 3: Center (Glitch Transition)
            setTimeout(() => {
                triggerGlitchTransition();
                doZoomPan('center', [44,45,54,55]);
            }, 12000);

            // Zoom Out (Full View)
            setTimeout(() => {
                triggerGlitchTransition();
                const card = document.getElementById('card-wrapper');
                card.style.transform = "scale(1)";
            }, 15000);

            // 5. TEXT DECODES (T+17s)
            setTimeout(() => {
                startHackerText();
                document.getElementById('final-header').classList.add('title-show');
            }, 17000);

            // 6. BACKGROUND SHIFT (T+20s)
            setTimeout(() => {
                const light = document.querySelector('.back-light');
                light.classList.remove('light-expand');
                light.classList.add('light-fill-screen');
                document.getElementById('final-header').classList.add('move-up');
            }, 20000);

            // 7. FINAL BURN REVEAL (T+22s)
            setTimeout(() => {
                startCenterOutBurn();
                
                // Music & Buttons
                setTimeout(() => {
                    const theme = document.getElementById('theme-audio');
                    theme.currentTime = 0;
                    theme.play();
                    document.querySelectorAll('.interaction-area, .share-area').forEach(el => el.style.opacity = 1);
                    applyParallax();
                    enableCardInteraction();
                }, 2000);
                
            }, 22000);
        }

        function triggerGlitchTransition() {
            document.body.classList.add('glitch-active');
            const buzz = document.getElementById('buzz-audio');
            buzz.currentTime = 0;
            buzz.volume = 1.0;
            buzz.play();
            
            setTimeout(() => {
                document.body.classList.remove('glitch-active');
                buzz.pause();
            }, 300); // Short sharp glitch
        }

        // Helper for Zoom Pan
        function doZoomPan(origin, indices) {
            const card = document.getElementById('card-wrapper');
            const cells = document.querySelectorAll('.grid-cell');

            // Set transform origin without animation if possible? No, css transition is on.
            // We use the glitch to hide the "jump" of origin change
            card.style.transformOrigin = origin;
            card.style.transform = "scale(2.5)"; // Stay zoomed
            
            // Reveal specific cells (Peek)
            setTimeout(() => {
                indices.forEach(i => cells[i].classList.add('peek-reveal'));
            }, 300);

            // Hide cells back
            setTimeout(() => {
                indices.forEach(i => cells[i].classList.remove('peek-reveal'));
            }, 2500); // Keep visible for a bit
        }

        function startCenterOutBurn() {
            const grid = document.getElementById('grid-overlay');
            const cells = Array.from(grid.children);
            const cols = 10;
            const rows = 10;
            const centerX = 4.5; 
            const centerY = 4.5;

            cells.forEach((cell, index) => {
                const x = index % cols;
                const y = Math.floor(index / cols);
                const distance = Math.sqrt(Math.pow(x - centerX, 2) + Math.pow(y - centerY, 2));
                const delay = distance * 200; 

                setTimeout(() => {
                    cell.classList.add('burn');
                    setTimeout(() => { cell.classList.add('vanish'); }, 200);
                }, delay);
            });
        }

        // --- 3D CARD INTERACTION ---
        function enableCardInteraction() {
            const card = document.getElementById('card-wrapper');
            const container = document.querySelector('.rift-container');
            if (!card || !container) return;

            container.addEventListener('mousemove', (e) => {
                const rect = container.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                const rotateX = ((y - centerY) / centerY) * -15; 
                const rotateY = ((x - centerX) / centerX) * 15;

                card.style.transform = `scale(1) perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
            });

            container.addEventListener('mouseleave', () => {
                card.style.transform = `scale(1) perspective(1000px) rotateX(0deg) rotateY(0deg)`;
            });
        }

        function applyParallax() {
            const scrollY = window.scrollY || window.pageYOffset;
            const cardWrap = document.getElementById('card-parallax');
            const actionsWrap = document.getElementById('actions-parallax');
            if (cardWrap) cardWrap.style.transform = `translateY(${scrollY * 0.08}px)`;
            if (actionsWrap) actionsWrap.style.transform = `translateY(${scrollY * 0.04}px)`;
        }
        window.addEventListener('scroll', applyParallax, { passive: true });

        // --- INTERACTION BUTTONS ---
        const dislikeBtn = document.getElementById('dislike-btn');
        const secretMsg = document.getElementById('secret-msg');
        const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints && navigator.maxTouchPoints > 0);

        if (isTouchDevice) {
            dislikeBtn.style.pointerEvents = "none";
            dislikeBtn.setAttribute('disabled', 'disabled');
            dislikeBtn.style.opacity = "0.6";
        }

        dislikeBtn.addEventListener('click', (e) => {
            if (isTouchDevice) {
                e.preventDefault();
                e.stopPropagation();
            }
        });

        dislikeBtn.addEventListener('mouseenter', () => {
            dislikeBtn.style.opacity = "0";
            if (!isTouchDevice) dislikeBtn.style.pointerEvents = "none"; 
            secretMsg.style.opacity = "1";
        });

        document.getElementById('vote-area').addEventListener('mouseleave', () => {
            dislikeBtn.style.opacity = "1";
            if (!isTouchDevice) dislikeBtn.style.pointerEvents = "auto";
            secretMsg.style.opacity = "0";
        });

        function addLike() {
            const countEl = document.getElementById('like-count');
            let count = parseInt(countEl.innerText);
            count++;
            countEl.innerText = count;
        }

        function shareWhatsApp() {
            const text = encodeURIComponent("Check this out: " + window.location.href);
            window.open(`https://wa.me/?text=${text}`, '_blank');
        }

        function copyShareLink() {
            const shareUrl = window.location.href;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(shareUrl).catch(() => {});
            }
        }

        function shareInstagram() {
            const shareUrl = encodeURIComponent(window.location.href);
            const shareText = encodeURIComponent("Check this drop: ");
            const instagramDirect = `https://www.instagram.com/direct/new/?text=${shareText}${shareUrl}`;
            if (navigator.share) {
                navigator.share({
                    title: "FINALLY IT IS HERE",
                    text: "Check this drop",
                    url: window.location.href
                }).catch(() => window.open(instagramDirect, '_blank'));
            } else {
                window.open(instagramDirect, '_blank');
            }
        }

        // --- 5. RUNAWAY BUTTON ---
        const btn = document.getElementById('runaway-btn');
        const quoteContainer = document.getElementById('quote-container');
        const quoteText = document.getElementById('quote-text');
        const quoteAuthor = document.getElementById('quote-author');
        let moveCount = 0; 

        const quotes = [
            { text: "Do you copy?", author: "Mike Wheeler" },
            { text: "Mouthbreather.", author: "Eleven" },
            { text: "Friends don't lie.", author: "Eleven" },
            { text: "Code Red!", author: "Dustin Henderson" },
            { text: "It's a trap!", author: "Mike Wheeler" },
            { text: "This is not a drill!", author: "Mike Wheeler" },
            { text: "Don't you dare walk away from me!", author: "Hopper" },
            { text: "I am on a curiosity voyage.", author: "Dustin Henderson" },
            { text: "She's our friend and she's crazy!", author: "Dustin Henderson" },
            { text: "The gate... I opened it.", author: "Eleven" }
        ];

        function teleportButton() {
            const viewportWidth = window.innerWidth;
            const viewportHeight = window.innerHeight;
            const btnRect = btn.getBoundingClientRect();
            
            // Safe Zone padding
            const padding = 60; 
            const maxX = viewportWidth - btnRect.width - padding;
            const maxY = viewportHeight - btnRect.height - padding;
            
            // Random Coordinates
            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(150, Math.floor(Math.random() * maxY)); 
            
            btn.style.left = randomX + 'px';
            btn.style.top = randomY + 'px';
            btn.style.transform = `translate(0, 0) rotate(${Math.random() * 20 - 10}deg)`; 
            
            // Show quote
            const qIndex = moveCount % quotes.length;
            if(quotes[qIndex]) {
                quoteText.innerText = `"${quotes[qIndex].text}"`;
                quoteAuthor.innerText = `- ${quotes[qIndex].author}`;
                quoteContainer.style.opacity = 1;
            }
            moveCount++;
        }

        // --- DESKTOP BEHAVIOR ---
        btn.addEventListener('mouseover', () => {
            if (Math.random() > 0.2) { 
                teleportButton();
            }
        });

        // --- MOBILE BEHAVIOR ---
        btn.addEventListener('touchstart', (e) => {
            if (Math.random() > 0.3) {
                e.preventDefault(); 
                teleportButton();
            }
        }, {passive: false});


        // --- CLICK HANDLER (Starts Game) ---
        btn.addEventListener('click', (e) => {
            console.log("Starting Light Game...");
            document.getElementById('main-content').style.opacity = '0';
            setTimeout(() => { document.getElementById('main-content').style.display = 'none'; }, 1000);
            initGame();
        });

        // ==========================================================
        // === LIGHTBULB GAME LOGIC ===
        // ==========================================================
        const gameOverlay = document.getElementById('game-overlay');
        const wallContainer = document.getElementById('alphabet-wall');
        const instructionEl = document.getElementById('wall-instruction');
        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split('');
        const levels = ["KYO", "NAHI", "HO", "RAHI", "PADHAI"];
        
        let currentLevel = 0;
        let playerSequence = [];
        let isPlayerTurn = false;
        let gameActive = false;
        const bulbColors = ['red', 'blue', 'yellow', 'green'];

        function initGame() {
            wallContainer.innerHTML = '';
            letters.forEach((char) => {
                const div = document.createElement('div');
                div.classList.add('letter-container');
                div.id = `letter-${char}`;
                const color = bulbColors[Math.floor(Math.random() * bulbColors.length)];
                
                div.innerHTML = `
                    <div class="wire"></div>
                    <div class="bulb" data-color="glow-${color}"></div>
                    <div class="letter-char">${char}</div>
                `;
                div.addEventListener('mousedown', () => handleInput(char));
                div.addEventListener('touchstart', (e) => { e.preventDefault(); handleInput(char); });
                wallContainer.appendChild(div);
            });

            gameOverlay.style.display = 'flex';
            setTimeout(() => { gameOverlay.style.opacity = '1'; }, 100);
            gameActive = true;
            currentLevel = 0;
            startLevel();
        }

        function startLevel() {
            isPlayerTurn = false;
            playerSequence = [];
            const targetWord = levels[currentLevel];
            instructionEl.innerText = "WAIT...";
            instructionEl.style.color = "yellow";
            setTimeout(() => { playSequence(targetWord, 0); }, 1000);
        }

        function playSequence(word, index) {
            if (index >= word.length) {
                setTimeout(() => {
                    isPlayerTurn = true;
                    instructionEl.innerText = "REPEAT...";
                    instructionEl.style.color = "#fff";
                }, 500);
                return;
            }
            const char = word[index];
            lightUp(char);
            const delay = Math.max(400, 1000 - (currentLevel * 100));
            setTimeout(() => { playSequence(word, index + 1); }, delay);
        }

        function lightUp(char) {
            const el = document.getElementById(`letter-${char}`);
            if(!el) return;
            const bulb = el.querySelector('.bulb');
            const colorClass = bulb.dataset.color;
            bulb.classList.add(colorClass);
            setTimeout(() => { bulb.classList.remove(colorClass); }, 600);
        }

        function handleInput(char) {
            if (!isPlayerTurn || !gameActive) return;
            const targetWord = levels[currentLevel];
            const expectedChar = targetWord[playerSequence.length];
            lightUp(char);

            if (char === expectedChar) {
                playerSequence.push(char);
                if (playerSequence.length === targetWord.length) {
                    isPlayerTurn = false;
                    currentLevel++;
                    if (currentLevel >= levels.length) {
                        winGame();
                    } else {
                        instructionEl.innerText = "GOOD...";
                        setTimeout(startLevel, 1500);
                    }
                }
            } else {
                isPlayerTurn = false;
                instructionEl.innerText = "RUN.";
                instructionEl.style.color = "red";
                const allBulbs = document.querySelectorAll('.bulb');
                allBulbs.forEach(b => b.classList.add('glow-red'));
                setTimeout(() => {
                    allBulbs.forEach(b => b.classList.remove('glow-red'));
                    startLevel(); 
                }, 1000);
            }
        }

        function winGame() {
            gameActive = false;
            instructionEl.innerText = "MESSAGE RECEIVED";
            let flashCount = 0;
            const flashInterval = setInterval(() => {
                const randomChar = letters[Math.floor(Math.random() * letters.length)];
                lightUp(randomChar);
                flashCount++;
                if(flashCount > 15) {
                    clearInterval(flashInterval);
                    // Instead of simple reveal, trigger the GRAND REVEAL logic
                    allowReveal = true;
                    startRevealSequence();
                }
            }, 100);
        }
    </script>
</body>
</html>
